[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server-sdk"
version = "0.1.0"
description = "A typed, resilient Python Server Developer Kit for backend services and REST APIs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "SDK Engineering Team", email = "oss@example.com" },
]
keywords = [
    "sdk",
    "server",
    "api-client",
    "rest",
    "backend",
    "pydantic",
    "asyncio",
    "httpx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/Arthur-911/SDK-Software-development-Kit-"
Documentation = "https://github.com/Arthur-911/SDK-Software-development-Kit-#readme"
Repository = "https://github.com/Arthur-911/SDK-Software-development-Kit-.git"
Issues = "https://github.com/Arthur-911/SDK-Software-development-Kit-/issues"
Changelog = "https://github.com/Arthur-911/SDK-Software-development-Kit-/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/server_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "SIM117", # allow nested with statements for readability in tests
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=server_sdk --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/server_sdk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
]
show_missing = true
fail_under = 100
